<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šulak - Official Website</title>
    
    <!-- Performance Optimizations -->
    <link rel="preload" href="src/css/styles.css" as="style">
    <link rel="preload" href="assets/images/logo_wht.png" as="image">
    <link rel="dns-prefetch" href="https://open.spotify.com">
    <link rel="dns-prefetch" href="https://sulak-merch.myspreadshop.com">
    
    <!-- SEO and Social Media -->
    <meta name="description" content="Šulak - Metal band drawing from ancient Babylonian mythology. Official website featuring music, tour dates, merchandise, and band information.">
    <meta name="keywords" content="Šulak, metal band, Babylonian mythology, dark metal, heavy music">
    
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="Šulak - Official Website">
    <meta property="og:description" content="Metal band drawing from ancient Babylonian mythology">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/images/sulak_color.png">
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; frame-src https://open.spotify.com; connect-src 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    
    <!-- Privacy and Security -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="robots.txt">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">

    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <!-- Header Container -->
    <div id="header-container">
    </div>

    <!-- Navigation Menu -->
    <nav>
        <a href="#information">Info</a>
        <a href="#music">Music</a>
        <a href="#releases">Releases</a>
        <a href="#shows">Shows</a>
        <a href="#bios">Bios</a>
        <a href="#merch">Merch</a>
        <a href="#origin">Origin</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main Content Containers -->
    <div id="information-container">
        <!-- Content will be loaded from sections/information.html -->
    </div>

    <div id="music-container">
        <!-- Content will be loaded from sections/music.html -->
    </div>

    <div id="releases-container">
        <!-- Content will be loaded from sections/releases.html -->
    </div>

    <div id="shows-container">
        <!-- Content will be loaded from sections/shows.html -->
    </div>

    <div id="bios-container">
        <!-- Content will be loaded from sections/bios.html -->
    </div>

    <div id="merch-container">
        <!-- Content will be loaded from sections/merch.html -->
    </div>

    <div id="origin-container">
        <!-- Content will be loaded from sections/origin.html -->
    </div>

    <div id="contact-container">
        <!-- Content will be loaded from sections/contact.html -->
    </div>

    <div id="footer-container">
        <!-- Content will be loaded from sections/footer.html -->
    </div>

    <!-- Site Visit Counter -->
    <!--<div id="visit-counter">
        <span class="counter-label">Site Visits:</span>
        <span id="visit-count">0</span>
    </div>-->

    <!-- Scripts loaded with defer for better performance -->
    <script defer src="src/js/section-loader-optimized.js"></script>
    <script defer src="src/js/scripts.js"></script>
    <script defer src="src/js/performance-monitor.js"></script>
</body>
</html>
